<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <g id="seals">
    <!-- Red Seal Left (Universitas Studii Taurinensis 1404) -->
    <g transform="translate(250, 180)">
      <circle cx="0" cy="0" r="170" fill="#E30613" />
      <circle cx="0" cy="0" r="160" fill="none" stroke="#FFFFFF" stroke-width="4" />
      <!-- Circular Text Arc Top/Bottom -->
      <path id="red-text-path-top" d="M -135,0 A 135,135 0 1,1 135,0" fill="none" />
      <path id="red-text-path-bottom" d="M 135,0 A 135,135 0 0,1 -135,0" fill="none" />
      <text font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">
        <textPath href="#red-text-path-top" startOffset="50%">UNIVERSITAS STUDII TAURINENSIS</textPath>
      </text>
      <text font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="6" text-anchor="middle">
        <textPath href="#red-text-path-bottom" startOffset="50%">1404</textPath>
      </text>
      <!-- Center Emblem: Eagle + Bull on Books -->
      <g transform="translate(0, 5)">
        <!-- Books base -->
        <rect x="-80" y="45" width="160" height="14" rx="3" fill="#FFFFFF" />
        <line x1="-70" y1="52" x2="70" y2="52" stroke="#E30613" stroke-width="2" />
        <rect x="-65" y="30" width="130" height="12" rx="2" fill="#FFFFFF" />
        <rect x="-50" y="18" width="100" height="10" rx="2" fill="#FFFFFF" />
        <path d="M-20,38 L-10,30 L0,38 L10,30 L20,38" fill="none" stroke="#E30613" stroke-width="2.5" />
        <!-- Bull -->
        <path d="M-50,22 C-55,5 -35,-15 -10,-10 C10,-10 35,0 45,15 C50,22 45,28 35,28 C15,28 -5,22 -35,22 Z" fill="#FFFFFF" />
        <path d="M-45,-5 C-55,-12 -60,-22 -52,-25 C-48,-20 -44,-10 -40,-2" fill="#FFFFFF" />
        <path d="M-38,-8 C-42,-20 -38,-30 -30,-28 C-32,-18 -34,-10 -35,-2" fill="#FFFFFF" />
        <!-- Crown above eagle -->
        <path d="M-18,-100 L-25,-115 L-10,-108 L0,-120 L10,-108 L25,-115 L18,-100 Z" fill="#FFFFFF" />
        <!-- Eagle -->
        <path d="M0,-95 L-12,-70 L-35,-80 L-22,-50 L-45,-45 L-20,-35 L0,-60 L20,-35 L45,-45 L22,-50 L35,-80 L12,-70 Z" fill="#FFFFFF" />
        <path d="M-5,-92 C-10,-98 -5,-105 0,-102 C5,-102 8,-96 5,-92 Z" fill="#FFFFFF" />
      </g>
    </g>

    <!-- Center Divider Line -->
    <line x1="520" y1="10" x2="520" y2="350" stroke="#575756" stroke-width="5" stroke-linecap="round" />

    <!-- Blue Seal Right (Dipartimento di Scienze Veterinarie 1769) -->
    <g transform="translate(790, 180)">
      <circle cx="0" cy="0" r="170" fill="none" stroke="#008CD5" stroke-width="12" />
      <circle cx="0" cy="0" r="158" fill="none" stroke="#008CD5" stroke-width="3" />
      <circle cx="0" cy="0" r="115" fill="none" stroke="#008CD5" stroke-width="3" />
      
      <path id="blue-text-path-top" d="M -136,0 A 136,136 0 1,1 136,0" fill="none" />
      <path id="blue-text-path-bottom" d="M 136,0 A 136,136 0 0,1 -136,0" fill="none" />
      <text font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="23" fill="#008CD5" letter-spacing="3" text-anchor="middle">
        <textPath href="#blue-text-path-top" startOffset="50%">DIPARTIMENTO DI SCIENZE VETERINARIE</textPath>
      </text>
      <text font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="25" fill="#008CD5" letter-spacing="5" text-anchor="middle">
        <textPath href="#blue-text-path-bottom" startOffset="50%">1769</textPath>
      </text>

      <!-- Centaur Archer Center -->
      <g transform="translate(5, 5)">
        <!-- Horse body -->
        <path d="M-55,20 C-65,-10 -40,-35 -10,-25 C0,-35 15,-40 25,-20 C35,-35 60,-35 70,-15 C75,0 65,25 50,35 C30,45 -10,45 -35,35 C-50,30 -60,28 -55,20 Z" fill="#008CD5" />
        <!-- Legs -->
        <path d="M-40,30 L-50,75 L-38,75 L-30,35 M-20,35 L-22,80 L-10,80 L-8,35 M20,35 L18,78 L30,78 L32,35 M45,30 L55,72 L65,72 L52,25" fill="#008CD5" stroke="#008CD5" stroke-width="4" stroke-linejoin="round" />
        <!-- Human torso & head -->
        <path d="M10,-20 C5,-45 15,-60 25,-75 C35,-85 50,-70 40,-50 C35,-35 25,-25 20,-20 Z" fill="#008CD5" />
        <circle cx="32" cy="-72" r="14" fill="#008CD5" />
        <!-- Bow & Arrow -->
        <path d="M-60,-50 Q 0,-90 60,-30" fill="none" stroke="#008CD5" stroke-width="5" />
        <line x1="-60" y1="-50" x2="60" y2="-30" stroke="#008CD5" stroke-width="2" />
        <line x1="-70" y1="-55" x2="80" y2="-25" stroke="#008CD5" stroke-width="4" />
        <path d="M80,-25 L65,-33 L70,-22 Z" fill="#008CD5" />
      </g>
    </g>
  </g>

  <!-- Bottom Main Typography: UNIVERSITÀ DI TORINO -->
  <g transform="translate(30, 420)">
    <!-- Row 1: UNIVERSITÀ -->
    <text x="0" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="88" letter-spacing="1">
      <tspan fill="#E30613">UNI</tspan><tspan fill="#4A4A4A">VERSITÀ</tspan>
    </text>
    <!-- Row 2: DI TORINO -->
    <text x="0" y="155" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="88" letter-spacing="1">
      <tspan fill="#4A4A4A">DI </tspan><tspan fill="#E30613">TO</tspan><tspan fill="#4A4A4A">RINO</tspan>
    </text>
  </g>
</svg>
